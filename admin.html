<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN - Salvation Predict</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{background:#0f172a;color:#fff;padding:16px;max-width:500px;margin:auto}
h1{font-size:20px;margin-bottom:12px}input,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;font-size:14px}
label{font-size:11px;color:#94a3b8;margin-top:10px;display:block;font-weight:800}
button{width:100%;padding:14px;border:none;border-radius:10px;font-weight:900;margin-top:10px;cursor:pointer}
.green{background:#22c55e;color:#fff}.dark{background:#1e293b;color:#fff}
#out{width:100%;height:160px;margin-top:12px;padding:10px;font-size:11px;background:#020617;color:#22c55e;border-radius:8px}
</style></head><body>
<h1>🔧 SALVATION ADMIN</h1>
<label>HOME</label><input id="home" placeholder="Vision FC">
<label>AWAY</label><input id="away" placeholder="Gold Stars">
<label>LEAGUE</label><select id="league"><option>GPL</option><option>PL</option><option>LaLiga</option><option>SerieA</option></select>
<label>TYPE</label><select id="type"><option value="1">1</option><option value="X">X</option><option value="2">2</option><option value="1X">1X</option><option value="X2">X2</option><option value="12">12</option></select>
<label>PREDICTION</label><input id="pred" value="1 • HOME WIN">
<label>CONFIDENCE</label><input id="conf" value="80% WON ✅">
<label>TIME</label><input id="time" value="TODAY 15:00">
<label>STATUS</label><select id="status"><option value="won">WON ✅ Green</option><option value="lost">LOST ❌ Red</option><option value="live">LIVE 🔴</option></select>
<label>YOUR WHATSAPP</label><input id="waNum" value="233540042669">

<button class="green" onclick="gen()">⚡ GENERATE</button>
<textarea id="out"></textarea>
<button class="green" onclick="navigator.clipboard.writeText(out.value);alert('Copied! Paste inside #box in index.html')">📋 COPY</button>
<script>
function gen(){
 let h=home.value||"Home",aw=away.value||"Away",lg=league.value,tp=type.value,pr=pred.value,cf=conf.value,tm=time.value,st=status.value;
 let badge=st==='won'?'✅ WON':st==='lost'?'❌ LOST':st==='live'?'🔴 LIVE':'⏳ PENDING';
 let code=`<div class="card ${st}" data-t="${tp}" data-l="${lg}" data-s="${st.toUpperCase()}"><span class="badge ${st}">${badge} • ${tm}</span><div class="row"><div class="team">${h}</div><div class="vs">VS</div><div class="team">${aw}</div></div><div class="meta"><span>Tip: <b>${pr}</b></span><span class="tag"> ${cf}</span></div><button class="wa" onclick="wa('${h} vs ${aw} - ${tp}')">💬 VIP WHATSAPP</button></div>`;
 out.value=code;return code;
}
</script>
</body></html>
