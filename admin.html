<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ADMIN PRO</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0a0618;color:#fff;padding:14px;padding-bottom:120px}.h{background:#12102a;padding:14px;border-radius:12px;display:flex;justify-content:space-between;margin-bottom:14px;border:1px solid #2a2560}.logo{font-weight:900;font-size:18px}.logo span{color:#FFD600}.card{background:#16122f;padding:14px;border-radius:16px;border:1px solid #25204d;margin-bottom:12px}input,textarea,select{width:100%;background:#0f0d24;color:#fff;border:1px solid #2a2560;padding:12px;border-radius:10px;margin:6px 0 10px;font-size:14px}label{font-size:11px;opacity:.8;font-weight:800}.btn{width:100%;background:#FFD600;color:#000;border:none;padding:14px;border-radius:12px;font-weight:900;margin-top:8px;cursor:pointer}.btn2{background:#1e1a3f;color:#fff;border:1px solid #2a2560}.btn3{background:#00FF88;color:#000}.match-item{background:#1f1a42;padding:10px;border-radius:10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid #2a2560;font-size:13px}#loginScreen{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0618;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}.loginBox{background:#16122f;padding:24px;border-radius:20px;border:1px solid #2a2560;width:100%;max-width:340px;text-align:center}.exportBox{background:#000;padding:12px;border-radius:10px;border:1px dashed #FFD600;margin-top:10px;max-height:200px;overflow:auto;font-size:11px;white-space:pre-wrap;word-break:break-all}</style></head><body><div id="loginScreen"><div class="loginBox"><div style="font-size:40px">🔐</div><h2 style="color:#FFD600">ADMIN PRO</h2><p style="opacity:.7;font-size:12px;margin:8px 0 14px">Password protected</p><input id="passInput" type="password" placeholder="Enter password" style="text-align:center"><button class="btn" onclick="checkPass()">🔓 UNLOCK</button><p id="passError" style="color:#ff4444;font-size:12px;margin-top:10px;display:none">Wrong password!</p><p style="opacity:.5;font-size:10px;margin-top:12px">Default: salvation123</p></div></div><div class="h"><div class="logo">SALVATION <span>ADMIN PRO</span></div><button onclick="logout()" style="background:#ff4444;color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:900">LOGOUT</button></div><div class="card" style="border-color:#FFD600"><h3 style="color:#FFD600">➕ ADD MATCH</h3><label>LEAGUE + TIME</label><input id="league" value="🌍 AFCON QUALIFIERS U17 • TODAY 17:00"><label>HOME TEAM</label><input id="home" placeholder="🇳🇬 Nigeria"><label>AWAY TEAM</label><input id="away" placeholder="🇲🇬 Madagascar"><div style="display:flex;gap:8px"><div style="flex:1"><label>ODD</label><input id="odd" value="1.45"></div><div style="flex:1"><label>MARKET</label><select id="market"><option>WIN</option><option>OVER 1.5</option><option>DOUBLE CHANCE</option><option>BTTS</option><option>HOME WIN + OVER</option></select></div></div><label>OUR PICK</label><input id="pick" placeholder="NIGERIA TO WIN + OVER 1.5 @1.85"><label>STATS / H2H</label><textarea id="stats" rows="2" placeholder="Last: Madagascar 0-2 Nigeria"></textarea><button class="btn" onclick="addMatch()">✅ ADD TO LIST</button></div><div class="card"><h3>📅 TODAY LIST (<span id="count">0</span>)</h3><div id="list"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn2" style="flex:1" onclick="clearAll()">🗑️ CLEAR</button><button class="btn btn3" style="flex:1" onclick="preview()">👁️ PREVIEW</button></div></div><div class="card" style="background:#1a1600;border-color:#FFD600"><h3 style="color:#FFD600">🚀 MAKE LIVE FOR ALL</h3><p style="font-size:11px;opacity:.8;margin:6px 0">Tap EXPORT → copy → paste in index.html</p><button class="btn" onclick="exportCode()">📋 EXPORT CODE</button><div id="exportArea" style="display:none"><p style="font-size:11px;color:#00FF88;margin-top:10px">✅ Copy this:</p><div id="exportBox" class="exportBox"></div><button class="btn btn3" onclick="copyExport()">📋 COPY CODE</button><p style="font-size:10px;opacity:.6;margin-top:8px">After copy → GitHub → index.html → Edit → Paste → Commit</p></div></div><div class="card"><a href="index.html" style="background:#00FF88;color:#000;padding:14px;display:block;text-align:center;border-radius:12px;font-weight:900;text-decoration:none">👁️ VIEW APP</a></div><script>const ADMIN_PASSWORD="salvation123";function checkPass(){if(document.getElementById('passInput').value===ADMIN_PASSWORD){localStorage.setItem('salvation_admin_auth','true');document.getElementById('loginScreen').style.display='none';render();}else document.getElementById('passError').style.display='block';}function logout(){localStorage.removeItem('salvation_admin_auth');location.reload();}if(localStorage.getItem('salvation_admin_auth')==='true')document.getElementById('loginScreen').style.display='none';let matches=JSON.parse(localStorage.getItem('salvation_matches')||'[]');function addMatch(){const m={league:document.getElementById('league').value,home:document.getElementById('home').value||'Home',away:document.getElementById('away').value||'Away',odd:document.getElementById('odd').value||'1.50',pick:document.getElementById('pick').value||'HOME WIN',stats:document.getElementById('stats').value||'Good form',pickDetail:document.getElementById('pick').value,market:document.getElementById('market').value};if(!m.home||!m.away){alert('Add teams');return}matches.push(m);localStorage.setItem('salvation_matches',JSON.stringify(matches));render();document.getElementById('home').value='';document.getElementById('away').value='';document.getElementById('pick').value='';}function render(){document.getElementById('count').innerText=matches.length;let h='';matches.forEach((m,i)=>{h+=`<div class="match-item"><div><b>${m.home} vs ${m.away}</b><br><small style="color:#FFD600">${m.pick} @${m.odd}</small></div><button onclick="removeMatch(${i})" style="background:#ff4444;color:#fff;border:none;padding:6px 10px;border-radius:8px">X</button></div>`});document.getElementById('list').innerHTML=h||'<small style="opacity:.6">No matches yet</small>';}function removeMatch(i){matches.splice(i,1);localStorage.setItem('salvation_matches',JSON.stringify(matches));render();}function clearAll(){if(confirm('Clear all?')){matches=[];localStorage.removeItem('salvation_matches');render();}}function preview(){localStorage.setItem('salvation_matches',JSON.stringify(matches));location.href='index.html';}function exportCode(){const code="const TODAY_MATCHES = "+JSON.stringify(matches,null,2)+";";document.getElementById('exportBox').innerText=code;document.getElementById('exportArea').style.display='block';}function copyExport(){navigator.clipboard.writeText(document.getElementById('exportBox').innerText).then(()=>alert('✅ Copied! Paste in index.html'));}render();</script></body></html>
