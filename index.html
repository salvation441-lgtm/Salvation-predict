<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SALVATION PREDICT - LIVE</title>
<style>body{background:#080e08;color:#fff;font-family:sans-serif;padding:12px}h1{color:#00ff66}.card{background:#111d11;border-left:4px solid #00ff66;margin:12px 0;padding:12px;border-radius:8px}</style>
</head><body>
<h1>SALVATION PREDICT</h1>
<div id="info" style="background:#152015;padding:10px;border-radius:6px">Loading...</div>
<div id="list"></div>
<script>
(async()=>{
  const info=document.getElementById('info'), list=document.getElementById('list');
  try{
    const res=await fetch('/api/live?c='+Date.now());
    if(!res.ok) throw new Error('API status '+res.status);
    const j=await res.json();
    info.innerHTML='✅ LIVE: '+j.count+' REAL games | '+j.date+' | '+j.plan;
    if(!j.today||j.today.length==0){list.innerHTML='<div class=card>No games now - API connected ok, check tomorrow</div>';return;}
    list.innerHTML=j.today.map(g=>`<div class=card><small>${g.l} - ${g.time} - ${g.status}</small><br><b>${g.h} vs ${g.a}</b><br>Tip: ${g.p} WIN @${g.o}<br>Score: ${g.s} ${g.live?'🔴':''}</div>`).join('');
  }catch(e){info.innerHTML='❌ FETCH ERROR: '+e.message+'<br>But API works at /api/live - hard refresh'; console.error(e);}
})();
</script>
</body></html>
