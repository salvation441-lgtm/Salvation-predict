<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SALVATION PREDICT</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial;padding-bottom:80px}.h{padding:14px;display:flex;justify-content:space-between;background:#0f0f0f;border-bottom:1px solid #222;position:sticky;top:0;z-index:5}.logo{color:#00FF66;font-weight:900;font-size:20px}.logo span{color:#fff}.search{width:92%;margin:10px 4%;background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:12px;color:#fff}.filters{display:flex;gap:8px;overflow-x:auto;padding:10px}.fb{white-space:nowrap;padding:9px 16px;border-radius:22px;border:1px solid #333;background:#1e1e1e;color:#aaa;font-weight:800;font-size:12px}.fb.active{background:#fff;color:#000}.fb.live{background:#FF3B30;color:#fff;border-color:#FF3B30}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.gi{background:#1e1e1e;border:1px solid #222;border-radius:10px;padding:11px;font-size:13px}.status{padding:10px 12px;font-weight:900;color:#00FF66;display:flex;justify-content:space-between}.card{background:#161616;border:1px solid #222;border-left:4px solid #00FF66;border-radius:14px;margin:10px 12px;padding:12px}.card.live{border-left-color:#FF3B30}.pick{color:#00FF66;font-weight:800;margin:8px 0;font-size:13px}.box{background:#0f0f0f;border:1px solid #222;border-radius:10px;padding:8px;margin:8px 0;font-size:11px}.bar{height:5px;background:#222;border-radius:5px;overflow:hidden;margin:4px 0}.fill{height:100%;background:#00FF66}.odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.odd{background:#1e2a1e;border-radius:8px;padding:8px;text-align:center}.odd b{color:#00FF66}.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0}.ni{color:#666;font-size:10px;text-align:center}.ni.active{color:#00FF66}</style></head><body>
<div class="h"><div class="logo">SALVATION <span>PREDICT</span></div><div id="d" style="font-size:11px;color:#888"></div></div>
<input id="q" class="search" placeholder="🔍 Search teams, leagues, Women, Men, Ghana..." oninput="doSearch(this.value)">
<div class="filters">
<button class="fb" id="bToday" onclick="showToday()">TODAY</button>
<button class="fb" id="bTom" onclick="showTom()">TOMORROW</button>
<button class="fb live active" id="bLive" onclick="showLive()">🔴 LIVE 3</button>
<button class="fb" id="bAll" onclick="showAll()">ALL EVENTS</button>
<button class="fb" id="bTop" onclick="showTop()">TOP 🔥</button>
</div>
<div class="grid"><div class="gi" onclick="showAll()">📋 All predictions ›</div><div class="gi" onclick="showToday()">📅 Today tips ›</div><div class="gi" onclick="showTop()">🔥 TOP predictions ›</div><div class="gi" onclick="showLive()">🔴 Live predictions ›</div></div>
<div class="status"><span id="st">🔴 LIVE NOW: 3 MATCHES</span><span id="tt" style="color:#888">3 tips</span></div>
<div id="list"></div>
<div class="nav"><div class="ni" onclick="showToday()">⚽<br>Today</div><div class="ni" onclick="showAll()">📋<br>All</div><div class="ni active" onclick="showLive()">🔴<br>Live</div><div class="ni" onclick="showTop()">🔥<br>Top</div><div class="ni" onclick="alert('VIP GH20 - Paystack soon')">👑<br>VIP</div></div>
<script>
let today=[{home:"Nigeria U17",away:"Madagascar U17",league:"AFCON U17",odd:"1.72",pick:"Nigeria U17 WIN"},{home:"Senegal U17",away:"Gambia U17",league:"AFCON U17",odd:"1.81",pick:"Senegal U17 WIN"},{home:"Morocco U17",away:"Algeria U17",league:"AFCON U17",odd:"1.82",pick:"Morocco WIN + OVER 1.5"},{home:"Ghana",away:"Egypt U17",league:"AFCON U17",odd:"1.90",pick:"HOME WIN"},{home:"England Women",away:"France Women",league:"Women Friendly",odd:"2.10",pick:"BTTS YES"},{home:"Brazil",away:"Argentina",league:"International Men",odd:"1.95",pick:"OVER 2.5"}];
let live=[{home:"Portugal",away:"Gibraltar",league:"EUROPE Friendlies",time:"28:19 H1",score:"0-0",odd:"1.72",oddX:"3.20",odd2:"4.50",hot:true},{home:"Eastleigh",away:"Truro",league:"ENGLAND National",time:"6:15 H1",score:"0-0",odd:"1.01",oddX:"19.0",odd2:"8.75",hot:false},{home:"Arsenal Tula U19",away:"Strogino U19",league:"RUSSIA U19",time:"15:36 H1",score:"0-1",odd:"1.55",oddX:"3.60",odd2:"5.00",hot:true}];
let tom=[{home:"Arsenal Women",away:"Chelsea Women",league:"WSL Tomorrow",odd:"2.25",pick:"OVER 2.5"},{home:"Real Madrid",away:"Barcelona",league:"La Liga Tomorrow",odd:"2.05",pick:"BTTS YES"}];
function card(m,isL){return '<div class="card '+(isL?'live':'')+'"><div style="font-size:11px;color:#888">'+(isL?(m.hot?'<span style="background:#FF3B30;color:#fff;padding:2px 6px;border-radius:5px">HOT 🔥</span> ':'🔴 LIVE ')+m.time+' • ':'')+m.league+' '+(isL?m.score:'')+'</div><div style="font-weight:800;margin:6px 0;font-size:16px">'+m.home+'<br><span style="color:#aaa">'+m.away+'</span></div><div class="pick">👉 '+(m.pick||m.home+' WIN')+' @'+m.odd+'</div><div class="box"><b style="color:#00FF66">STATAREA: </b>1 55% | X 25% | 2 20%<div class="bar"><div class="fill" style="width:55%"></div></div>Over 2.5: 65% | BTTS Yes: 62%</div><div class="odds"><div class="odd"><small>1</small><b>'+m.odd+'</b></div><div class="odd"><small>X</small><b>'+(m.oddX||'3.20')+'</b></div><div class="odd"><small>2</small><b>'+(m.odd2||'4.50')+'</b></div></div></div>';}
function render(arr,isL){document.getElementById('list').innerHTML=arr.map(function(m){return card(m,isL)}).join('');document.getElementById('tt').innerText=arr.length+' tips'}
function setB(id){document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('active')});document.getElementById(id).classList.add('active')}
function showToday(){setB('bToday');document.getElementById('st').innerText='📅 TODAY';render(today,false)}
function showLive(){setB('bLive');document.getElementById('st').innerText='🔴 LIVE NOW: 3 MATCHES';render(live,true)}
function showTom(){setB('bTom');document.getElementById('st').innerText='📅 TOMORROW';render(tom,false)}
function showAll(){setB('bAll');document.getElementById('st').innerText='📋 ALL PREDICTIONS';render(today.concat(live).concat(tom),false)}
function showTop(){setB('bTop');document.getElementById('st').innerText='🔥 TOP PREDICTIONS';render(today.slice(0,3),false)}
function doSearch(q){q=q.toLowerCase();if(!q){showLive();return}let pool=today.concat(live).concat(tom);let f=pool.filter(function(m){return (m.home+m.away+m.league).toLowerCase().indexOf(q)>-1});document.getElementById('st').innerText='🔍 '+q;render(f,false)}
document.getElementById('d').innerText=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
showLive();
</script></body></html>
