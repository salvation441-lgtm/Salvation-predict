<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salvation Predict</title><script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0a0e1a;color:white;font-family:sans-serif}.no-scrollbar::-webkit-scrollbar{display:none}</style>
</head><body>
<div class="bg-black border-b border-gray-800 p-4 flex justify-between items-center sticky top-0 z-50">
<h1 class="font-black text-xl leading-none">SALVATION<br>PREDICT</h1>
<button onclick="goVIP()" class="bg-green-600 text-xs font-bold px-3 py-2 rounded-lg">OCT 3 2026<br>VIP 50 GHS</button>
</div>

<div class="p-3 space-y-2 bg-black sticky top-[68px] z-40">
<div class="flex gap-2 overflow-x-auto no-scrollbar">
<button onclick="filterType('ALL',this)" class="type-btn bg-white text-black px-5 py-2 rounded-full text-sm font-bold">ALL</button>
<button onclick="filterType('1',this)" class="type-btn bg-[#1a1f2e] px-5 py-2 rounded-full text-sm">1</button>
<button onclick="filterType('X',this)" class="type-btn bg-[#1a1f2e] px-5 py-2 rounded-full text-sm">X</button>
<button onclick="filterType('2',this)" class="type-btn bg-[#1a1f2e] px-5 py-2 rounded-full text-sm">2</button>
<button onclick="filterType('BTTS',this)" class="type-btn bg-[#1a1f2e] px-5 py-2 rounded-full text-sm">BTTS</button>
<button onclick="filterType('OVER',this)" class="type-btn bg-[#1a1f2e] px-5 py-2 rounded-full text-sm">OVER</button>
</div>
<div class="flex gap-2 overflow-x-auto no-scrollbar">
<button onclick="filterLeague('ALL',this)" class="league-btn border border-green-500 text-green-400 px-4 py-1.5 rounded-full text-xs">ALL</button>
<button onclick="filterLeague('PL',this)" class="league-btn border border-gray-700 px-4 py-1.5 rounded-full text-xs">PL</button>
<button onclick="filterLeague('LaLiga',this)" class="league-btn border border-gray-700 px-4 py-1.5 rounded-full text-xs">La Liga</button>
<button onclick="filterLeague('SerieA',this)" class="league-btn border border-gray-700 px-4 py-1.5 rounded-full text-xs">Serie A</button>
<button onclick="filterLeague('Bundes',this)" class="league-btn border border-gray-700 px-4 py-1.5 rounded-full text-xs">Bundes</button>
<button onclick="filterLeague('GPL',this)" class="league-btn border border-yellow-500 text-yellow-400 px-4 py-1.5 rounded-full text-xs">GPL 🇬🇭</button>
</div>
</div>

<div id="games" class="p-3 space-y-3 pb-24"></div>

<div class="fixed bottom-0 left-0 right-0 bg-[#0f1420] border-t border-gray-800 flex justify-around py-2 text-[11px]">
<button class="flex flex-col items-center text-green-400"><span>🏠</span>Home</button>
<button class="flex flex-col items-center text-gray-500"><span>•</span>LIVE</button>
<button onclick="goVIP()" class="flex flex-col items-center text-gray-500"><span>👑</span>VIP</button>
<button class="flex flex-col items-center text-gray-500"><span>📊</span>Results</button>
<button class="flex flex-col items-center text-gray-500"><span>⚙️</span>Settings</button>
</div>

<script>
let activeType='ALL', activeLeague='ALL';
let games = [
{home:"Dreams FC",away:"Hearts of Oak",league:"GPL",leagueFull:"Ghana Premier - 80%",type:"1",pred:"AWAY WIN",conf:80,info:"15:00 TODAY 🔴"},
{home:"Vision FC",away:"Bibiani Gold Stars",league:"GPL",leagueFull:"Ghana Premier - 75%",type:"1",pred:"HOME WIN",conf:75,info:"16:00 TODAY"},
{home:"Arsenal",away:"Bournemouth",league:"PL",leagueFull:"PL - 88%",type:"1",pred:"HOME WIN",conf:88,info:"FT 2-0 WON ✅"},
{home:"Man City",away:"Newcastle",league:"PL",leagueFull:"Premier League - 92%",type:"OVER",pred:"OVER 2.5",conf:92,info:"17:30"},
{home:"Barcelona",away:"Espanyol",league:"LaLiga",leagueFull:"La Liga - 94%",type:"1",pred:"HOME WIN",conf:94,info:"19:00"},
{home:"Inter Milan",away:"AC Milan",league:"SerieA",leagueFull:"Serie A - 85%",type:"BTTS",pred:"BTTS YES",conf:85,info:"20:45 TODAY"},
{home:"Bayern Munich",away:"Dortmund",league:"Bundes",leagueFull:"Bundesliga - 88%",type:"OVER",pred:"OVER 2.5",conf:88,info:"Tomorrow 17:30"}
];

function render(){
  const c=document.getElementById('games'); c.innerHTML='';
  let filtered=games.filter(g=>(activeType==='ALL'||g.type===activeType)&&(activeLeague==='ALL'||g.league===activeLeague));
  filtered.forEach(g=>{
    c.innerHTML+=`
    <div class="bg-[#131a2b] border border-gray-800 rounded-xl p-3 border-l-4 border-l-green-500">
      <div class="flex justify-between text-[11px] text-gray-400 mb-1"><span>${g.leagueFull}</span><span>${g.info}</span></div>
      <div class="font-bold">${g.home} vs ${g.away}</div>
      <div class="flex justify-between mt-2 text-xs"><span class="text-gray-400">Tip: <b class="text-white">${g.pred}</b></span><span class="text-green-400">${g.conf}% Conf</span></div>
    </div>`;
  });
  if(filtered.length===0) c.innerHTML='<p class="text-center text-gray-500 py-10">No games for this filter</p>';
}
function filterType(t,btn){
  activeType=t;
  document.querySelectorAll('.type-btn').forEach(b=>{b.className='type-btn bg-[#1a1f2e] px-5 py-2 rounded-full text-sm'});
  btn.className='type-btn bg-white text-black px-5 py-2 rounded-full text-sm font-bold';
  render();
}
function filterLeague(l,btn){
  activeLeague=l;
  document.querySelectorAll('.league-btn').forEach(b=>b.classList.remove('border-green-500','text-green-400'));
  btn.classList.add('border-green-500','text-green-400');
  render();
}
function goVIP(){alert('VIP 50 GHS - Momo Pay coming next!');}
render();
</script>
</body></html>
