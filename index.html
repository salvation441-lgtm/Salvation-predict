<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SALVATION PREDICT - PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#121212;color:#fff;font-family:Arial,sans-serif;padding:10px}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.logo{color:#00FF66;font-weight:900;font-size:20px}
.logo span{color:#fff}
.search-box{width:100%;background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:12px 15px;color:#fff;font-size:15px;margin:10px 0;outline:none}
.search-box:focus{border-color:#00FF66}
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.filter-btn{white-space:nowrap;padding:8px 16px;border-radius:20px;border:none;background:#2a2a2a;color:#ccc;font-weight:600}
.filter-btn.active{background:#fff;color:#000}
.market-filters{display:flex;gap:8px;overflow-x:auto;margin:10px 0}
.market-btn{padding:8px 14px;border-radius:20px;border:none;background:#2a2a2a;color:#aaa;font-size:13px}
.market-btn.active{background:#FF3B30;color:#fff}
.live-header{color:#FF3B30;font-weight:800;margin:10px 0;display:flex;align-items:center;gap:6px}
.match-card{background:#1e1e1e;border-radius:14px;padding:14px;margin-bottom:10px;position:relative}
.match-time{color:#888;font-size:12px;display:flex;gap:8px;align-items:center}
.hot{background:#FF3B30;color:#fff;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800}
.team-row{display:flex;justify-content:space-between;margin:6px 0;font-size:16px}
.odds-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.odd-box{background:#2a3a2a;border-radius:10px;padding:10px;text-align:center;color:#00FF66;font-weight:800;font-size:18px}
.odd-label{color:#888;font-size:11px;display:block;margin-bottom:2px}
.modal{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:0.3s;z-index:100}
.modal.open{transform:translateY(0)}
.modal-tabs{display:flex;gap:10px;margin:15px 0;overflow-x:auto}
.tab{padding:8px 14px;background:#2a2a2a;border-radius:8px;font-size:13px;white-space:nowrap}
.tab.active{background:#00FF66;color:#000}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a2a2a;font-size:13px}
</style>
</head>
<body>

<div class="header">
<div class="logo">SALVATION <span>PREDICT</span></div>
<div id="dateTime" style="font-size:12px;color:#888"></div>
</div>

<input id="globalSearch" class="search-box" placeholder="🔍 Search teams, leagues, countries, women/men..." oninput="handleSearch(this.value)">

<div class="filters">
<button class="filter-btn active" onclick="loadToday()" id="btnToday">TODAY <span id="todayCount"></span></button>
<button class="filter-btn" onclick="loadTomorrow()" id="btnTom">TOMORROW</button>
<button class="filter-btn" style="background:#FF3B30;color:#fff" onclick="loadLive()" id="btnLive">🔴 LIVE <span id="liveCount">3</span></button>
<button class="filter-btn" onclick="loadAll()" id="btnAll">ALL EVENTS</button>
</div>

<div class="market-filters">
<button class="market-btn active" onclick="filterMarket('1x2')">1X2</button>
<button class="market-btn" onclick="filterMarket('over')">Over/Under</button>
<button class="market-btn" onclick="filterMarket('dc')">Double Chance</button>
<button class="market-btn" onclick="filterMarket('btts')">BTTS</button>
<button class="market-btn" onclick="filterMarket('all')">All Markets</button>
</div>

<div id="liveHeader" class="live-header">🔴 LIVE NOW: <span id="liveNow">3 MATCHES</span></div>

<div id="matches">Loading...</div>

<!-- STATS MODAL -->
<div id="matchModal" class="modal">
<div style="display:flex;justify-content:space-between"><h3 id="modalTitle">Match Stats</h3><span onclick="closeModal()" style="font-size:22px">✕</span></div>
<div class="modal-tabs">
<div class="tab active" onclick="showTab('stats')">📊 Statistics</div>
<div class="tab" onclick="showTab('standing')">🏆 Standings</div>
<div class="tab" onclick="showTab('h2h')">⚔️ H2H</div>
<div class="tab" onclick="showTab('home')">🏠 Home/Away</div>
</div>
<div id="modalContent"></div>
</div>

<script>
let allMatches=[], liveMatches=[], currentFilter='1x2';
function updateTime(){document.getElementById('dateTime').innerText=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' • '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
setInterval(updateTime,1000);updateTime();

async function loadToday(){
 setActive('btnToday');
 let r=await fetch('/api/auto-picks'); let d=await r.json();
 allMatches=d.matches||d.picks||[]; document.getElementById('todayCount').innerText=allMatches.length;
 renderMatches(allMatches);
}
async function loadLive(){
 setActive('btnLive');
 let r=await fetch('/api/live'); let d=await r.json();
 liveMatches=d.live||[]; document.getElementById('liveNow').innerText=liveMatches.length+' MATCHES';
 renderLive(liveMatches);
}
async function loadTomorrow(){
 setActive('btnTom');
 let r=await fetch('/api/tomorrow'); let d=await r.json();
 renderMatches(d.matches||[]);
}
async function loadAll(){
 setActive('btnAll');
 let [t,l]=await Promise.all([fetch('/api/auto-picks').then(r=>r.json()), fetch('/api/live').then(r=>r.json())]);
 let combined=[...(t.matches||[]), ...(l.live||[]).map(g=>({home:g.home,away:g.away,league:g.league,odd:g.odds['1']||'1.90',pick:g.market}))];
 renderMatches(combined);
}

function setActive(id){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active')}

function renderMatches(list){
 let html='';
 list.forEach(m=>{
  html+=`<div class="match-card" onclick="openModal('${m.home}','${m.away}','${m.league}')">
   <div class="match-time">${m.league||'Today'} • ${m.time||''}</div>
   <div class="team-row"><span>${m.home}</span><b>${m.homeScore||''}</b></div>
   <div class="team-row"><span>${m.away}</span><b>${m.awayScore||''}</b></div>
   <div style="color:#00FF66;font-size:12px;margin-top:6px">👉 ${m.pick||m.odd} @${m.odd||'1.90'}</div>
   <div class="odds-row">
    <div class="odd-box"><span class="odd-label">1</span>${m.odd||'1.90'}</div>
    <div class="odd-box"><span class="odd-label">X</span>3.20</div>
    <div class="odd-box"><span class="odd-label">2</span>4.50</div>
   </div>
  </div>`;
 });
 document.getElementById('matches').innerHTML=html||'No matches';
}

function renderLive(list){
 let html='';
 list.forEach(g=>{
  html+=`<div class="match-card" onclick="openModal('${g.home}','${g.away}','${g.league}')">
   <div class="match-time">${g.hot?'<span class="hot">HOT 🔥</span>':''} ${g.time} &nbsp; ${g.league}</div>
   <div class="team-row"><span>${g.home}</span><b>${g.homeScore}</b></div>
   <div class="team-row"><span>${g.away}</span><b>${g.awayScore}</b></div>
   <div style="font-size:11px;color:#888;margin-top:4px">◎ ${g.market} &nbsp;&nbsp; 1 &nbsp;&nbsp;&nbsp; X &nbsp;&nbsp;&nbsp; 2</div>
   <div class="odds-row">
    <div class="odd-box">${g.odds['1']}</div>
    <div class="odd-box">${g.odds['X']}</div>
    <div class="odd-box">${g.odds['2']}</div>
   </div>
   <div style="font-size:11px;color:#666;margin-top:6px">+${g.markets} ›</div>
  </div>`;
 });
 document.getElementById('matches').innerHTML=html;
}

function handleSearch(q){
 q=q.toLowerCase();
 if(!q){renderMatches(allMatches);return}
 let filtered=allMatches.filter(m=>
  (m.home+m.away+m.league).toLowerCase().includes(q) ||
  q.includes('women') || q.includes('men') || q.includes('international')
 );
 // If search for women/men/international, show all with that tag + live
 if(q.includes('women') || q.includes('u17') || q.includes('ghana') || q.includes('nigeria')){
   filtered=[...allMatches,...liveMatches.map(g=>({home:g.home,away:g.away,league:g.league,odd:g.odds['1']}))].filter(m=>(m.home+m.away+m.league).toLowerCase().includes(q));
 }
 renderMatches(filtered);
 if(filtered.length==0){document.getElementById('matches').innerHTML=`<div style="text-align:center;padding:20px;color:#888">No results for "${q}"<br><small>Try: Nigeria, England, Women, U17, Ghana</small></div>`}
}

function filterMarket(type){
 document.querySelectorAll('.market-btn').forEach(b=>b.classList.remove('active'));
 event.target.classList.add('active');
 currentFilter=type;
 // Just re-render for demo (in real app filter by market)
 renderMatches(allMatches);
}

function openModal(home,away,league){
 document.getElementById('matchModal').classList.add('open');
 document.getElementById('modalTitle').innerText=home+' vs '+away;
 showTab('stats',home,away,league);
}
function closeModal(){document.getElementById('matchModal').classList.remove('open')}

function showTab(tab,home,away,league){
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 event?.target?.classList.add('active');
 let c=document.getElementById('modalContent');
 if(tab=='stats'){
  c.innerHTML=`<div class="stat-row"><span>League</span><b>${league||'International'}</b></div>
  <div class="stat-row"><span>Form (Last 5)</span><b>${home?.[0]||'N'}: W-W-D-W-W vs ${away?.[0]||'M'}: L-D-W-L-W</b></div>
  <div class="stat-row"><span>Goals Avg</span><b>2.8 per match</b></div>
  <div class="stat-row"><span>Possession</span><b>58% - 42%</b></div>
  <div class="stat-row"><span>Corners</span><b>6.2 - 3.1</b></div>
  <div class="stat-row"><span>Shots on Target</span><b>5 - 2</b></div>`;
 }else if(tab=='standing'){
  c.innerHTML=`<div class="stat-row"><span>1. ${home||'Home'}</span><b>15 pts - 1st</b></div>
  <div class="stat-row"><span>5. ${away||'Away'}</span><b>9 pts - 5th</b></div>
  <div class="stat-row"><span>Group</span><b>AFCON U17 Qualifiers Group B</b></div>`;
 }else if(tab=='h2h'){
  c.innerHTML=`<div class="stat-row"><span>Last 3 H2H</span><b>${home} 2-0 ${away}</b></div>
  <div class="stat-row"><span>2024</span><b>${home} 1-1 ${away}</b></div>
  <div class="stat-row"><span>2023</span><b>${away} 0-2 ${home}</b></div>`;
 }else{
  c.innerHTML=`<div class="stat-row"><span>${home} at Home</span><b>W4 D1 L0 - 12 goals</b></div>
  <div class="stat-row"><span>${away} Away</span><b>W1 D1 L3 - 4 goals</b></div>`;
 }
}
loadToday();loadLive();
</script>
</body>
</html>
