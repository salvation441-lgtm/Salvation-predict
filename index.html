<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salvation Predict</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:#fff;padding-bottom:75px}
.header{background:#111;padding:16px;text-align:center;border-bottom:2px solid #00ff88}
.header h1{color:#00ff88;font-size:22px}
.filters{padding:10px;display:flex;gap:6px;overflow-x:auto}
.filters::-webkit-scrollbar{display:none}
.filters button{padding:7px 12px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;font-size:12px;white-space:nowrap}
.filters button.on{background:#00ff88;color:#000;font-weight:bold}
.card{background:#151515;margin:10px;border-radius:12px;padding:12px;border:1px solid #222}
.top{color:#888;font-size:11px;display:flex;justify-content:space-between}
.mid{margin:10px 0;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.vs{background:#222;padding:2px 8px;border-radius:10px;font-size:10px;color:#666}
.badge{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:bold}
.b1{background:#00ff88;color:#000}
.bx{background:#444;color:#fff}
.b2{background:#ff4444;color:#fff}
.tip{background:#1e1e1e;padding:9px;border-radius:8px;border-left:3px solid #00ff88;margin-top:8px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.tip b{color:#00ff88}
.dot{width:7px;height:7px;background:red;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0}
.nav div{color:#666;font-size:10px;text-align:center}
.nav div.on{color:#00ff88}
.hide{display:none!important}
</style>
</head>
<body>
<div class="header"><h1>SALVATION PREDICT</h1><p style="font-size:10px;color:#666">CLICK FILTERS - THEY WORK NOW!</p></div>

<div class="filters" id="f1">
<button class="on" onclick="setM('all',this)">ALL</button>
<button onclick="setM('1',this)">1</button>
