<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SALVATION PREDICT - Live</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070a07;color:#fff;font-family:system-ui;padding:12px}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
h1{color:#00ff66;font-size:20px} h1 span{color:#fff}
.card{border-left:4px solid #00ff66;background:#141a14;margin:14px 0;padding:12px;border-radius:10px}
.league{font-size:11px;opacity:.6;margin-bottom:6px}
.teams{font-size:18px;font-weight:800;line-height:1.2}
.teams span{opacity:.6;font-weight:400}
.pred{color:#00ff66;font-weight:800;margin:10px 0}
.odds{display:flex;gap:8px}
.odd{flex:1;background:#1e331e;border-radius:8px;padding:8px;text-align:center;font-size:13px}
.odd b{color:#00ff66;display:block;font-size:16px;margin-top:2px}
.small{font-size:11px;opacity:.5;margin-top:6px}
#info{background:#101410;padding:10px;border-radius:8px;font-size:13px;margin:10px 0;border:1px solid #1e331e}
</style>
</head>
<body>
<div class="header"><h1>SALVATION <span>PREDICT</span></h1><div id="date" style="font-size:12px;opacity:.7"></div></div>
<div id="info">⏳ Loading REAL live games from API-Football...</div>
<div id="list"></div>

<script>
async function load(){
  const info = document.getElementById('info');
  const list = document.getElementById('list');
  const dEl = document.getElementById('date');
  try{
    const r = await fetch('/api/live?t='+Date.now());
    const j = await r.json();
