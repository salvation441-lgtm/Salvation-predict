<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SALVATION PREDICT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#eef2f7;padding-bottom:80px}
.top{background:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}
.top h1{font-weight:900;font-size:16px;line-height:14px}
.vip{background:#0f172a;color:#fff;padding:6px 10px;border-radius:8px;font-size:9px;font-weight:800;text-align:center}
.fil{padding:8px 10px;background:#fff;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid #e2e8f0;position:sticky;z-index:10}.fil::-webkit-scrollbar{display:none}
#f1{top:49px}#f2{top:91px}
.b{padding:6px 14px;border-radius:20px;border:1px solid #e2e8f0;background:#f8fafc;color:#64748b;font-size:11px;font-weight:700;white-space:nowrap}
.b.active{background:#22c55e;color:#fff;border-color:#22c55e}
.b2{padding:6px 12px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;color:#64748b;font-size:10px;white-space:nowrap}
.b2.active{background:#0f172a;color:#fff}
.card{background:#fff;border:1px solid #e8eef5;border-radius:14px;padding:12px;margin:8px 10px}
.small{font-size:9px;background:#22c55e;color:#fff;padding:3px 8px;border-radius:20px;display:inline-block}
.live{background:#ef4444!important}
.dot{width:7px;height:7px;background:#fff;border-radius:50%;display:inline-block;animation:blink 1s infinite;margin-right:4px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.head{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.team{text-align:center;width:110px}.team b{font-size:12px;display:block;margin-top:4px}
.ico{width:44px;height:44px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto}
.vs{font-weight:900;color:#94a3b8}
.meta{display:flex;justify-content:space-between;font-size:11px;margin-top:8px}
.conf{background:#dcfce7;color:#166534;padding:2px 8px;border-radius:20px;font-weight:700;font-size:10px}
</style></head><body>

<div class="top"><h1>SALVATION<br>PREDICT</h1><div class="vip" id="dateBox">VIP 50 GHS</div></div>

<div class="fil" id="f1">
<button class="b active" data-v="ALL">ALL</button><button class="b" data-v="1">1</button><button class="b" data-v="X">X</button><button class="b" data-v="2">2</button><button class="b" data-v="BTTS">BTTS</button><button class="b" data-v="OVER">OVER</button>
</div>
<div class="fil" id="f2">

function render(){
  document.getElementById('list').innerHTML = GAMES.map(g=>`

}

// FILTERS
let curT='ALL',curL='ALL';
function doFilter(){
  document.querySelectorAll('.card').forEach(c=>{
    const ok=(curT==='ALL'||c.dataset.t===curT)&&(curL==='ALL'||c.dataset.l===curL);
    c.style.display=ok?'block':'none';
  });
}
