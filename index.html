<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salvation Predict</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:#fff;padding-bottom:70px}
.header{background:#111;padding:15px;text-align:center;border-bottom:2px solid #00ff88}
.header h1{color:#00ff88;font-size:22px}
.filter-bar{padding:12px;position:sticky;top:0;background:#0a0a0a;z-index:9}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.filter-row::-webkit-scrollbar{display:none}
.filter-btn{padding:8px 16px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;white-space:nowrap}
.filter-btn.active{background:#00ff88;color:#000;font-weight:bold}
.league-row{display:flex;gap:8px;overflow-x:auto;margin-top:6px}
.league-chip{background:#1a1a1a;color:#aaa;padding:6px 12px;border-radius:15px;font-size:12px;border:1px solid #222;white-space:nowrap}
.card{background:#151515;margin:12px;border-radius:12px;padding:14px;border:1px solid #222}
.card-top{display:flex;justify-content:space-between;color:#888;font-size:12px}
.card-match{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-weight:bold}
.vs{color:#666;font-weight:normal}
.tip-box{background:#1e1e1e;padding:10px;border-radius:8px;border-left:3px solid #00ff88;margin:8px 0}
.tip-box b{color:#00ff88}
.action-row{display:flex;gap:8px;margin-top:10px}
.action-row button{flex:1;padding:9px;border-radius:8px;border:1px solid #333;font-size:12px}
.btn-copy{background:#00ff88;color:#000;border:none;font-weight:bold}
.btn-stat,.btn-share{background:#222;color:#fff}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0}
.nav-item{text-align:center;color:#888;font-size:10px}
.nav-item.active{color:#00ff88}
</style>
</head>
<body>
<div class="header"><h1>SALVATION PREDICT</h1><p style="font-size:11px;color:#888">DEMO MODE - 87% ACCURACY</p></div>
<div class="filter-bar">
<div class="filter-row">
<button class="filter-btn active">ALL</button>
<button class="filter-btn">Today</button>
<button class="filter-btn">Live</button>
<button class="filter-btn">87%+ Confidence</button>
</div>
<div class="league-row">
<span class="league-chip">Premier League</span><span class="league-chip">La Liga</span><span class="league-chip">Serie A</span><span class="league-chip">Bundesliga</span>
</div>
</div>

<div id="games"></div>

<div class="bottom-nav">
<div class="nav-item active">H<br>Home</div>
<div class="nav-item">L<br>Live</div>
<div class="nav-item">*<br>VIP</div>
<div class="nav-item">R<br>Results</div>
<div class="nav-item">S<br>Settings</div>
</div>

<script>
const games=[
{league:"Premier League - 18:00",home:"Arsenal",away:"Man City",tip:"Arsenal WIN",odd:"2.17",conf:87},
{league:"La Liga - 19:30",home:"Real Madrid",away:"Barcelona",tip:"BTTS YES",odd:"1.80",conf:91},
{league:"Serie A - 20:45",home:"Inter Milan",away:"AC Milan",tip:"Over 2.5",odd:"1.95",conf:84},
{league:"Bundesliga - 17:30",home:"Bayern Munich",away:"Dortmund",tip:"Home Win",odd:"1.65",conf:89}
];
let h="";
games.forEach(g=>{
h+=`<div class="card"><div class="card-top"><span>${g.league}</span><span style="color:#00ff88">${g.conf}%</span></div><div class="card-match"><span>${g.home}</span><span class="vs">VS</span><span>${g.away}</span></div><div class="tip-box">Tip: <b>${g.tip}</b> @${g.odd}</div><div class="action-row"><button class="btn-stat">Stats</button><button class="btn-copy" onclick="navigator.clipboard.writeText('${g.home} vs ${g.away} - ${g.tip} @${g.odd}');this.innerText='Copied!'">Copy Tip</button><button class="btn-share">Share</button></div></div>`;
});
document.getElementById("games").innerHTML=h;
</script>
</body>
</html>
