<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SALVATION PREDICT</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0f0f0f;color:white;font-family:sans-serif}</style>
</head>
<body class="pb-20">
<header class="p-4 flex justify-between items-center border-b border-gray-800">
<h1 class="font-black text-xl">SALVATION PREDICT</h1>
<span class="text-xs bg-green-600 px-2 py-1 rounded">OCT 2 2026 - WORKING</span>
</header>

<!-- TOP FILTERS - 1 X 2 with content -->
<div class="flex gap-2 p-3 overflow-x-auto">
<button onclick="setType('ALL')" class="filter-btn active bg-white text-black px-4 py-1 rounded-full text-sm font-bold">ALL</button>
<button onclick="setType('1')" class="filter-btn bg-gray-800 px-4 py-1 rounded-full text-sm">1</button>
<button onclick="setType('X')" class="filter-btn bg-gray-800 px-4 py-1 rounded-full text-sm">X</button>
<button onclick="setType('2')" class="filter-btn bg-gray-800 px-4 py-1 rounded-full text-sm">2</button>
<button onclick="setType('BTTS')" class="filter-btn bg-gray-800 px-4 py-1 rounded-full text-sm">BTTS</button>
<button onclick="setType('OVER')" class="filter-btn bg-gray-800 px-4 py-1 rounded-full text-sm">OVER</button>
</div>

<!-- LEAGUE FILTERS + GPL ADDED -->
<div class="flex gap-2 px-3 overflow-x-auto">
<button onclick="setLeague('ALL')" class="league-btn active border border-green-500 text-green-500 px-3 py-1 rounded-full text-xs">ALL</button>
<button onclick="setLeague('PL')" class="league-btn border border-gray-700 px-3 py-1 rounded-full text-xs">PL</button>
<button onclick="setLeague('LaLiga')" class="league-btn border border-gray-700 px-3 py-1 rounded-full text-xs">La Liga</button>
<button onclick="setLeague('SerieA')" class="league-btn border border-gray-700 px-3 py-1 rounded-full text-xs">Serie A</button>
<button onclick="setLeague('Bundes')" class="league-btn border border-gray-700 px-3 py-1 rounded-full text-xs">Bundes</button>
<button onclick="setLeague('GPL')" class="league-btn border border-yellow-500 text-yellow-500 px-3 py-1 rounded-full text-xs">GPL 🇬🇭</button>
<button onclick="setLeague('UCL')" class="league-btn border border-blue-500 text-blue-500 px-3 py-1 rounded-full text-xs">UCL</button>
</div>

<div id="games" class="p-3 space-y-3 mt-2">
<!-- Games will load here -->
</div>

<nav class="fixed bottom-0 w-full bg-black border-t border-gray-800 flex justify-around p-3 text-xs">
<span>🏠 Home</span><span class="text-green-500">● LIVE</span><span>👑 VIP</span><span>📊 Results</span><span>⚙️ Settings</span>
</nav>

<script>
let activeType = 'ALL';
let activeLeague = 'ALL';

let allGames = [
 {home:"Arsenal", away:"Bournemouth", league:"PL", type:"1", pred:"HOME WIN", conf:88, result:"WON"},
 {home:"Barcelona", away:"Espanyol", league:"LaLiga", type:"1", pred:"HOME WIN", conf:94, live:"Barca 1-0 67'"},
 {home:"Hearts of Oak", away:"Kotoko", league:"GPL", type:"1", pred:"HOME WIN", conf:85, time:"15:00"},
 {home:"Chelsea", away:"Liverpool", league:"PL", type:"OVER", pred:"OVER 2.5", conf:90},
 {home:"Bayern", away:"Dortmund", league:"Bundes", type:"2", pred:"AWAY WIN", conf:82},
 {home:"Inter", away:"AC Milan", league:"SerieA", type:"X", pred:"DRAW", conf:78},
 {home:"Man City", away:"Arsenal", league:"PL", type:"BTTS", pred:"BTTS YES", conf:92}
];

function render(){
 let filtered = allGames.filter(g=>{
   let typeOk = activeType==='ALL' || g.type===activeType;
   let leagueOk = activeLeague==='ALL' || g.league===activeLeague;
   return typeOk && leagueOk;
 });
 document.getElementById('games').innerHTML = filtered.map(g=>`
   <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
     <div class="flex justify-between text-xs text-gray-400"><span>${g.league}</span><span class="text-green-400">${g.conf}%</span></div>
     <div class="font-bold mt-1">${g.home} vs ${g.away}</div>
     <div class="mt-2 flex justify-between items-center">
       <span class="bg-white text-black px-3 py-1 rounded-full text-xs font-bold">${g.pred}</span>
       <span class="text-xs ${g.result?'text-green-400':''}">${g.live||g.result||g.time||''}</span>
     </div>
   </div>
 `).join('') || '<p class="text-center text-gray-500 mt-10">No games for this filter</p>';
}

function setType(t){
 activeType=t;
 document.querySelectorAll('.filter-btn').forEach(b=>b.className='filter-btn bg-gray-800 px-4 py-1 rounded-full text-sm');
 event.target.className='filter-btn active bg-white text-black px-4 py-1 rounded-full text-sm font-bold';
 render();
}
function setLeague(l){
 activeLeague=l;
 render();
}
render();

// Load real live data from your API
fetch('/api/live').then(r=>r.json()).then(data=>{
 if(data && data.length){ allGames = [...data, ...allGames]; render(); }
}).catch(()=>{});
</script><!-- ADD PAYSTACK SCRIPT IN HEAD -->
<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
let activeType='ALL', activeLeague='ALL';
let allGames=[];

function setType(t,el){
 activeType=t;
 document.querySelectorAll('.filter-btn').forEach(b=>b.classList.replace('bg-white','bg-gray-800'));
 document.querySelectorAll('.filter-btn').forEach(b=>b.classList.replace('text-black','text-white'));
 el.classList.replace('bg-gray-800','bg-white'); el.classList.replace('text-white','text-black');
 render();
}
function setLeague(l,el){
 activeLeague=l;
 render();
}
function render(){
 let f=allGames.filter(g=>{
  return (activeType==='ALL'||g.type===activeType) && (activeLeague==='ALL'||g.league.includes(activeLeague)||g.league===activeLeague);
 });
 document.getElementById('games').innerHTML=f.map(g=>`
  <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
   <div class="flex justify-between text-xs text-gray-400"><span>${g.league}</span><span class="text-green-400">${g.conf}%</span></div>
   <div class="font-bold mt-1">${g.home} vs ${g.away}</div>
   <div class="mt-2 flex justify-between"><span class="bg-white text-black px-3 py-1 rounded-full text-xs font-bold">${g.pred}</span><span class="text-xs text-green-400">${g.live||g.result||''}</span></div>
  </div>`).join('');
}
async function loadLive(){
 let r=await fetch('/api/live'); let d=await r.json();
 allGames=d.length?d:[
  {home:"Arsenal",away:"Bournemouth",league:"PL",type:"1",pred:"HOME WIN",conf:88,result:"WON"},
  {home:"Barcelona",away:"Espanyol",league:"LaLiga",type:"1",pred:"HOME WIN",conf:94,live:"1-0 67'"},
  {home:"Hearts of Oak",away:"Kotoko",league:"GPL",type:"1",pred:"HOME WIN",conf:85,live:"15:00"},
  {home:"Chelsea",away:"Liverpool",league:"PL",type:"OVER",pred:"OVER 2.5",conf:90}
 ]; render();
}
function payVIP(){
 PaystackPop.setup({
  key: 'pk_test_YOUR_KEY_HERE', // replace with your Paystack public key
  email: 'user@gmail.com',
  amount: 5000*100, // 50 GHS
  currency: 'GHS',
  callback: function(){ alert('VIP Activated! 🔥'); }
 }).openIframe();
}
loadLive();
  </script>
</body>
</html>
