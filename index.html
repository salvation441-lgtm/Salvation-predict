<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SALVATION PREDICT - REAL LIVE</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial;padding-bottom:80px}.h{padding:14px;background:#0f0f0f;border-bottom:1px solid #222;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}.logo{color:#00FF66;font-weight:900;font-size:20px}.logo span{color:#fff}.search{width:92%;margin:10px 4%;background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:12px;color:#fff}.f{display:flex;gap:8px;overflow-x:auto;padding:10px}.fb{white-space:nowrap;padding:9px 16px;border-radius:22px;border:1px solid #333;background:#1e1e1e;color:#aaa;font-weight:800;font-size:12px}.fb.on{background:#fff;color:#000}.fb.live{background:#FF3B30;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.gi{background:#1e1e1e;border:1px solid #222;border-radius:10px;padding:11px;font-size:13px}.status{padding:10px 12px;font-weight:900;color:#00FF66;display:flex;justify-content:space-between}.card{background:#161616;border:1px solid #222;border-left:4px solid #00FF66;border-radius:14px;margin:10px 12px;padding:12px}.card.live{border-left-color:#FF3B30}.pick{color:#00FF66;font-weight:800;margin:8px 0}.box{background:#0f0f0f;border:1px solid #222;border-radius:10px;padding:8px;margin:8px 0;font-size:11px}.odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.odd{background:#1e2a1e;border-radius:8px;padding:8px;text-align:center}.odd b{color:#00FF66}</style></head><body>
<div class="h"><div class="logo">SALVATION <span>PREDICT</span></div><div id="dt" style="color:#888;font-size:11px"></div></div>
<input id="q" class="search" placeholder="🔍 Search teams..." oninput="searchQ(this.value)">
<div class="f">
<button class="fb on" id="bToday">TODAY</button>
<button class="fb" id="bTom">TOMORROW</button>
<button class="fb live" id="bLive">🔴 LIVE</button>
<button class="fb" id="bAll">ALL EVENTS</button>
<button class="fb" id="bTop">TOP 🔥</button>
</div>
<div class="grid">
<div class="gi" onclick="bAll.click()">📋 All predictions ›</div>
<div class="gi" onclick="bToday.click()">📅 Today tips ›</div>
<div class="gi" onclick="bTop.click()">🔥 TOP predictions ›</div>
<div class="gi" onclick="bLive.click()">🔴 Live predictions ›</div>
</div>
<div class="status"><span id="st">📅 TODAY: 6 TIPS</span><span id="tt" style="color:#888">Loading real...</span></div>
<div id="list"></div>
<script>
let today=[{h:"Nigeria U17",a:"Madagascar U17",l:"AFCON U17 - TODAY",o:"1.72",p:"Nigeria U17 WIN"},{h:"Senegal U17",a:"Gambia U17",l:"AFCON U17 - TODAY",o:"1.81",p:"Senegal U17 WIN"},{h:"Morocco U17",a:"Algeria U17",l:"AFCON U17 - TODAY",o:"1.82",p:"Morocco WIN + OVER 1.5"},{h:"Ghana",a:"Egypt U17",l:"AFCON U17 - TODAY",o:"1.90",p:"HOME WIN"},{h:"England Women",a:"France Women",l:"Women Friendly - TODAY",o:"2.10",p:"BTTS YES"},{h:"Brazil",a:"Argentina",l:"International Men - TODAY",o:"1.95",p:"OVER 2.5"}];
let live=[{h:"Portugal",a:"Gibraltar",l:"EUROPE Friendlies • 28:19 H1",s:"0-0",o:"1.72",x:"3.20",o2:"4.50",hot:1},{h:"Eastleigh",a:"Truro",l:"ENGLAND National • 6:15 H1",s:"0-0",o:"1.01",x:"19.0",o2:"8.75"}];
let tom=[{h:"Arsenal Women",a:"Chelsea Women",l:"WSL - Tomorrow",o:"2.25",p:"OVER 2.5"},{h:"Real Madrid",a:"Barcelona",l:"La Liga - Tomorrow",o:"2.05",p:"BTTS YES"}];
function mk(m,isL){return '<div class="card '+(isL?'live':'')+'"><div style="font-size:11px;color:#888">'+(isL?'<b style="background:'+(m.hot?'#FF3B30':'#333')+';color:#fff;padding:2px 6px;border-radius:5px">'+(m.hot?'HOT 🔥':'LIVE')+'</b> '+m.l+' ':'📅 '+m.l)+' '+(isL?m.s:'')+'</div><div style="font-weight:800;margin:6px 0;font-size:16px">'+m.h+'<br><span style="color:#aaa">'+m.a+'</span></div><div class="pick">👉 '+(m.p||m.h+' WIN')+' @'+m.o+'</div><div class="box"><b style="color:#00FF66">STATAREA:</b> 1 58% | X 22% | 2 20%<br>Over 2.5: 65% | BTTS Yes: 62% | Form: WWW - LWL</div><div class="odds"><div class="odd"><small>1</small><br><b>'+m.o+'</b></div><div class="odd"><small>X</small><br><b>'+(m.x||'3.20')+'</b></div><div class="odd"><small>2</small><br><b>'+(m.o2||'4.50')+'</b></div></div></div>';}
function draw(arr,isL){document.getElementById('list').innerHTML=arr.map(function(m){return mk(m,isL)}).join('');document.getElementById('tt').innerText=arr.length+' tips • Auto: '+new Date().toLocaleTimeString()}
function on(id){document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('on')});document.getElementById(id).classList.add('on')}
bToday.onclick=function(){on('bToday');st.innerText='📅 TODAY: 6 TIPS';draw(today,false)};
bTom.onclick=function(){on('bTom');st.innerText='📅 TOMORROW: 2 TIPS';draw(tom,false)};
bLive.onclick=function(){on('bLive');st.innerText='🔴 LIVE NOW: '+live.length+' MATCHES';draw(live,true)};
bAll.onclick=function(){on('bAll');st.innerText='📋 ALL: '+(today.length+live.length+tom.length)+' TIPS';draw(today.concat(live).concat(tom),false)};
bTop.onclick=function(){on('bTop');st.innerText='🔥 TOP PREDICTIONS';draw(today.slice(0,3),false)};
function searchQ(q){q=q.toLowerCase();if(!q){on('bToday');st.innerText='📅 TODAY: 6 TIPS';draw(today,false);return}let pool=today.concat(live).concat(tom);let f=pool.filter(function(m){return (m.h+m.a+m.l).toLowerCase().indexOf(q)>-1});st.innerText='🔍 "'+q+'" - '+f.length+' found';draw(f,false)}
// REAL API AUTO UPDATE
async function loadRealLive(){
  try{
    let r = await fetch('/api/live?t='+Date.now());
    let data = await r.json();
    if(data && data.length>0){
      live = data;
      bLive.innerText='🔴 LIVE '+live.length;
      if(document.getElementById('bLive').classList.contains('on')){
        draw(live,true);
        st.innerText='🔴 LIVE NOW: '+live.length+' MATCHES (Auto '+new Date().toLocaleTimeString()+')';
      }
    }
  }catch(e){console.log('live fetch fail')}
}
setInterval(loadRealLive, 30000);
loadRealLive();
dt.innerText=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
draw(today,false);
</script></body></html>
