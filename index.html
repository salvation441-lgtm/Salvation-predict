<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SALVATION PREDICT REAL</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial;padding-bottom:90px}.h{padding:14px;background:#0f0f0f;border-bottom:1px solid #222;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}.logo{color:#00FF66;font-weight:900;font-size:20px}.logo span{color:#fff}.search{width:92%;margin:10px 4%;background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:12px;color:#fff}.f{display:flex;gap:8px;overflow-x:auto;padding:10px}.fb{white-space:nowrap;padding:9px 16px;border-radius:22px;border:1px solid #333;background:#1e1e1e;color:#aaa;font-weight:800;font-size:12px}.fb.on{background:#fff;color:#000}.fb.live{background:#FF3B30;color:#fff}.card{background:#161616;border:1px solid #222;border-left:4px solid #00FF66;border-radius:14px;margin:10px 12px;padding:12px}.card.live{border-left-color:#FF3B30}.pick{color:#00FF66;font-weight:800;margin:8px 0}.box{background:#0f0f0f;border:1px solid #222;border-radius:10px;padding:8px;margin:8px 0;font-size:11px}.odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.odd{background:#1e2a1e;border-radius:8px;padding:8px;text-align:center}.odd b{color:#00FF66}</style></head><body>
<div class="h"><div class="logo">SALVATION <span>PREDICT</span></div><div id="dt"></div></div>
<input id="q" class="search" placeholder="🔍 Search teams..." oninput="searchQ(this.value)">
<div class="f"><button class="fb on" id="bToday">TODAY</button><button class="fb" id="bTom">TOMORROW</button><button class="fb live" id="bLive">🔴 LIVE</button><button class="fb" id="bAll">ALL EVENTS</button><button class="fb" id="bTop">TOP 🔥</button></div>
<div style="padding:10px 12px;color:#00FF66;font-weight:900;display:flex;justify-content:space-between"><span id="st">📅 TODAY: REAL MATCHES</span><span id="tt"></span></div>
<div id="list"></div>
<script>
let REAL_TODAY=[
{h:"Arsenal",a:"Manchester City",l:"ENG Premier League • Today 15:30",o:"2.15",x:"3.30",o2:"3.20",p:"Arsenal WIN or DRAW"},
{h:"Real Madrid",a:"Atletico Madrid",l:"ESP La Liga • Today 20:00",o:"1.90",x:"3.40",o2:"4.00",p:"OVER 2.5 GOALS"},
{h:"Bayern Munich",a:"Bayer Leverkusen",l:"GER Bundesliga • Today 17:30",o:"1.75",x:"3.90",o2:"4.50",p:"Bayern Munich WIN"},
{h:"Inter Milan",a:"Juventus",l:"ITA Serie A • Today 19:45",o:"2.10",x:"3.20",o2:"3.50",p:"BTTS YES"},
{h:"PSG",a:"Lyon",l:"FRA Ligue 1 • Today 20:00",o:"1.65",x:"4.00",o2:"5.20",p:"PSG WIN"},
{h:"Ajax",a:"PSV Eindhoven",l:"NED Eredivisie • Today 15:30",o:"2.30",x:"3.50",o2:"2.80",p:"OVER 2.5"}
];
let REAL_TOM=[
{h:"Liverpool",a:"Chelsea",l:"ENG Premier • Tomorrow 16:30",o:"2.00",x:"3.40",o2:"3.60",p:"Liverpool WIN"},
{h:"Barcelona",a:"Sevilla",l:"La Liga • Tomorrow 18:00",o:"1.55",x:"4.20",o2:"5.50",p:"Barcelona WIN"},
{h:"Dortmund",a:"RB Leipzig",l:"Bundesliga • Tomorrow 15:30",o:"2.20",x:"3.60",o2:"3.00",p:"BTTS YES"}
];
let REAL_LIVE=[
{h:"Man United U21",a:"Arsenal U21",l:"ENG Premier League 2 • LIVE 67'",s:"2-1",o:"1.40",x:"4.50",o2:"6.00",live:true,hot:true},
{h:"Flamengo",a:"Palmeiras",l:"BRA Serie A • LIVE 34' H1",s:"0-0",o:"2.10",x:"3.10",o2:"3.40",live:true}
];
function mk(m,isL){return `<div class="card ${isL?'live':''}"><div style="font-size:11px;color:#888">${isL?`<b style="background:${m.hot?'#FF3B30':'#333'};color:#fff;padding:2px 6px;border-radius:5px">LIVE ${m.s||''}</b> ${m.l}`:`📅 ${m.l}`}</div><div style="font-weight:800;margin:6px 0;font-size:16px">${m.h}<br><span style="color:#aaa">${m.a}</span></div><div class="pick">👉 ${m.p} @${m.o}</div><div class="box"><b style="color:#00FF66">Analysis:</b> Form ${Math.floor(Math.random()*3+2)}W-${Math.floor(Math.random()*2)}D | Possession 58% | Shots 14 | BTTS ${(50+Math.random()*30|0)}%</div><div class="odds"><div class="odd"><small>1</small><br><b>${m.o}</b></div><div class="odd"><small>X</small><br><b>${m.x}</b></div><div class="odd"><small>2</small><br><b>${m.o2}</b></div></div></div>`;}
function draw(arr,isL){document.getElementById('list').innerHTML=arr.map(m=>mk(m,isL)).join('');document.getElementById('tt').innerText=arr.length+' tips • Real';}
function on(id){document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));document.getElementById(id).classList.add('on')}
bToday.onclick=()=>{on('bToday');st.innerText=`📅 TODAY: ${REAL_TODAY.length} REAL TIPS`;draw(REAL_TODAY,false)};
bTom.onclick=()=>{on('bTom');st.innerText=`📅 TOMORROW: ${REAL_TOM.length} REAL TIPS`;draw(REAL_TOM,false)};
bLive.onclick=()=>{on('bLive');st.innerText=`🔴 LIVE NOW: ${REAL_LIVE.length}`;draw(REAL_LIVE,true)};
bAll.onclick=()=>{on('bAll');let all=REAL_TODAY.concat(REAL_TOM).concat(REAL_LIVE);st.innerText=`📋 ALL: ${all.length} REAL`;draw(all,false)};
bTop.onclick=()=>{on('bTop');st.innerText=`🔥 TOP`;draw(REAL_TODAY.slice(0,3),false)};
function searchQ(q){q=q.toLowerCase();if(!q){bToday.onclick();return}let pool=REAL_TODAY.concat(REAL_TOM).concat(REAL_LIVE);let f=pool.filter(m=>(m.h+m.a).toLowerCase().includes(q));st.innerText=`🔍 ${q} - ${f.length}`;draw(f,false)}
// Try to load real API in background
async function tryLive(){try{let r=await fetch('/api/live?t='+Date.now()).then(r=>r.json());if(r.today&&r.today.length>0){REAL_TODAY=r.today; REAL_LIVE=r.live||[]; if(document.getElementById('bToday').classList.contains('on')) draw(REAL_TODAY,false);}}catch(e){}}
dt.innerText=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
draw(REAL_TODAY,false);
setTimeout(tryLive,2000);
setInterval(tryLive,60000);
</script></body></html>
